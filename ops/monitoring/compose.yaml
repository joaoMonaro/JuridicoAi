name: juridicoai-monitoring
# All published management ports bind to host loopback; services communicate on a private network.
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    ports: ["127.0.0.1:4318:4318"]
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
  prometheus:
    ports: ["127.0.0.1:9090:9090"]
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--web.listen-address=0.0.0.0:9090", "--storage.tsdb.retention.time=15d"]
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
  alertmanager:
    ports: ["127.0.0.1:9093:9093"]
    image: prom/alertmanager:v0.35.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml", "--web.listen-address=0.0.0.0:9093", "--cluster.listen-address="]
    restart: unless-stopped
    volumes:
      - ./alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
  blackbox:
    extra_hosts: ["host.docker.internal:host-gateway"]
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/config.yaml", "--web.listen-address=0.0.0.0:9115"]
    restart: unless-stopped
    volumes:
      - ./blackbox.yaml:/etc/blackbox/config.yaml:ro
  grafana:
    ports: ["127.0.0.1:3001:3001"]
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3001
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_PASSWORD: ${MONITORING_GRAFANA_PASSWORD:?defina MONITORING_GRAFANA_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
